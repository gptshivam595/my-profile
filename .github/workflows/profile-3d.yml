name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Make a compact dark 3D graph
        run: |
          python3 << 'PY'
          from pathlib import Path
          src = Path("profile-3d-contrib/profile-night-green.svg")
          svg = src.read_text()

          def drop_group(svg, transform_prefix):
              token = f'<g transform="{transform_prefix}'
              start = svg.find(token)
              if start < 0:
                  return svg
              i = start
              depth = 0
              while i < len(svg):
                  if svg.startswith("<g", i):
                      depth += 1
                      i += 2
                      continue
                  if svg.startswith("</g>", i):
                      depth -= 1
                      i += 4
                      if depth == 0:
                          return svg[:start] + svg[i:]
                      continue
                  i += 1
              return svg

          for prefix in ("translate(40, 520)", "translate(980, 284.5)"):
              svg = drop_group(svg, prefix)
          svg = svg.replace("#00000f", "#0d1117")
          svg = svg.replace(
              'width="1280" height="850" viewBox="0 0 1280 850"',
              'width="1020" height="600" viewBox="180 210 1020 600"',
              1,
          )
          Path("profile-3d-contrib/profile-clean.svg").write_text(svg)
          PY
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No graph changes to commit"
            exit 0
          fi
          git commit -m "generated 3d contribution graph"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push rejected, retry ${attempt}"
            sleep 3
          done
          exit 1
